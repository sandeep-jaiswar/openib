id = "fred"
name = "FRED economic series"
publisher = "Federal Reserve Bank of St. Louis"
terms_url = "https://fred.stlouisfed.org/docs/api/terms_of_use.html"
transport = "https"
version = "2026-10"
profiles = ["full"]
requires_credential = true

